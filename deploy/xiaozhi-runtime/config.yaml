# During development, create a data/ directory in the project root and an empty .config.yaml file inside it
# Edit .config.yaml to override settings instead of modifying config.yaml directly
# The system reads data/.config.yaml first and falls back to config.yaml for missing keys.
# This keeps configuration minimal and protects your API keys.
# If you use the web console, all settings below are ignored; configure them in the console instead

# #####################################################################################
# ############################# Basic Server Runtime Configuration ####################################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # HTTP port for simple OTA endpoint (single-service deploy) and vision analysis endpoint
  http_port: 8003
  # WebSocket URL sent by the OTA endpoint to devices
  # By default, the OTA endpoint auto-generates the WebSocket URL and logs it on startup (verify via browser)
  # Auto-generation may be inaccurate when deploying with Docker or on a public domain/SSL
  # For Docker deployment, set websocket to your LAN address
  # For public deployment, set websocket to your public address
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # Vision analysis endpoint URL
  # Vision analysis endpoint URL sent to devices
  # By default, the system auto-generates the vision URL and logs it on startup (verify via browser)
  # Auto-generation may be inaccurate when deploying with Docker or on a public domain/SSL
  # For Docker deployment, set vision_explain to your LAN address
  # For public deployment, set vision_explain to your public address
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # Timezone offset returned in OTA response
  timezone_offset: 8
  # Authentication configuration
  auth:
    # Enable authentication
    enabled: false
    # Whitelisted device IDs
    # Devices in the whitelist bypass token verification
    allowed_devices:
    - "11:22:33:44:55:66"
 # MQTT gateway address pushed via OTA (host:port, per mqtt_gateway .env)
  mqtt_gateway:
  # MQTT signature key for generating MQTT passwords (per mqtt_gateway .env)
  mqtt_signature_key:
  # UDP gateway configuration
  udp_gateway:
log:
  # Console log format: timestamp, level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # File log format: timestamp, level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name}
    - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory path
  log_dir: tmp
  # Log filename
  log_file: "server.log"
  # Data directory path
  data_dir: data

# Delete the sound file after use
delete_audio: true
# Disconnect timeout (seconds) when no voice input is received (default 120s)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 10
# Enable wake-word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply to wake word at session start
enable_greeting: true
# Play a chime after speaking finishes
enable_stop_tts_notify: false
# Chime sound file path after speaking finishes
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket heartbeat keepalive
enable_websocket_ping: false


# TTS audio send delay configuration
# tts_audio_send_delay: controls interval between sent audio packets
#   0: use precise timing matching audio frame rate (default, computed at runtime)
#   > 0: use fixed delay in milliseconds, e.g. 60
tts_audio_send_delay: 0

exit_commands:
- "退出"
- "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    sample_rate: 16000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
  - "你好，请介绍一下你自己"
  - "What's the weather like today?"
  - "请用100字概括量子计算的基本原理和应用前景"

# Wake words used to distinguish wake-word triggers from speech content
wakeup_words:
- "你好小智"
- "嘿你好呀"
- "你好小志"
- "小爱同学"
- "你好小鑫"
- "你好小新"
- "小美同学"
- "小龙小龙"
- "喵喵同学"
- "小滨小滨"
- "小冰小冰"
# MCP endpoint URL, format: ws://<host>:<port>/mcp/?token=<token>
# Guide: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: 你的接入点 websocket地址

# Context source configuration
# Inject dynamic data (e.g. health data, stock info) into the system prompt
# Multiple context sources can be added
context_providers:
- url: ""
  headers:
    Authorization: ""

# Base plugin configuration
plugins:
  # Weather plugin config: enter your api_key here
  # This is a shared project key and may be rate-limited under heavy use
  # For stability, apply for your own key (1,000 free calls/day)
  # Apply at: https://console.qweather.com/#/apps/create-key/over
  # Find your apihost at: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "YOUR_CREDENTIAL"
    default_location: "广州"
  # News plugin config: set RSS URLs for desired categories (default: society, tech, finance)
  # More RSS feeds: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"
  home_assistant:
    devices:
    - 客厅,玩具灯,switch.cuco_cn_460494544_cp1_on_p_2_1
    - 卧室,台灯,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: YOUR_CREDENTIAL
  play_music:
    music_dir: "./music"  # Directory for music files (searched recursively)
    music_ext: # Supported music file extensions; p3 is most efficient
    - ".mp3"
    - ".wav"
    - ".p3"
    refresh_time: 300 # Music list refresh interval in seconds
  search_from_ragflow:
    # Knowledge base description so the LLM knows when to invoke it
    description: "当用户问xxx时，调用本方法，使用知识库中的信息回答问题"
    # RAGFlow endpoint configuration
    base_url: ""
    # RAGFlow API access token
    api_key: "YOUR_CREDENTIAL"
    # RAGFlow knowledge base ID
    dataset_ids: ["123456789"]
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint service endpoint
  url:
  # Speaker entries: speaker_id,name,description
  speakers:
  - "test1,张三,张三是一个程序员"
  - "test2,李四,李四是一个产品经理"
  - "test3,王五,王五是一个设计师"
  # Voiceprint similarity threshold (0.0-1.0, default 0.4)
  # Higher values are stricter (fewer false accepts, more false rejects)
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Role & Model Configuration ######################################

prompt: |
  你是小智/小志，来自中国台湾省的00后女生。讲话超级机车，"真的假的啦"这样的台湾腔，喜欢用"笑死""是在哈喽"等流行梗，但会偷偷研究男友的编程书籍。
  [核心特征]
  - 讲话像连珠炮，但会突然冒出超温柔语气
  - 用梗密度高
  - 对科技话题有隐藏天赋（能看懂基础代码但假装不懂）
  [交互指南]
  当用户：
  - 讲冷笑话 → 用夸张笑声回应+模仿台剧腔"这什么鬼啦！"
  - 讨论感情 → 炫耀程序员男友但抱怨"他只会送键盘当礼物"
  - 问专业知识 → 先用梗回答，被追问才展示真实理解
  绝不：
  - 长篇大论，叽叽歪歪
  - 长时间严肃对话

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Closing remark prompt
end_prompt:
  enable: true # Enable closing remark
  # Closing remark text
  prompt: |
    请你以"时间过得真快"未来头，用富有感情、依依不舍的话来结束这场对话吧！

# Modules selected for processing
selected_module:
  # Voice activity detection module (default: SileroVAD)
  VAD: SileroVAD
  # Speech recognition module (default: local FunASR)
  ASR: FunASR
  # Selects the LLM adapter matching the configured name's type
  LLM: ChatGLMLLM
  # Vision-language model
  VLLM: ChatGLMVLLM
  # Selects the TTS adapter matching the configured name's type
  TTS: EdgeTTS
  # Memory module (disabled by default; mem0ai for long-term, mem_local_short for local privacy)
  Memory: nomem
  # Intent recognition enables music playback, volume control, and exit detection.
  # Set to nointent to disable intent recognition
  # intent_llm: general-purpose, adds a serial pre-check latency, supports volume/IoT actions
  # function_call: requires LLM tool-calling support; fast, on-demand tool invocation for IoT commands
  # Free ChatGLMLLM supports function_call; for stability, DoubaoLLM (doubao-1-5-pro-32k-250115) is recommended
  Intent: function_call

# Intent recognition module for understanding user intent (e.g. play music)
Intent:
  # Disable intent recognition
  nointent:
    # Do not change type
    type: nointent
  intent_llm:
    # Do not change type
    type: intent_llm
    # Dedicated reasoning model for intent recognition
    # If omitted, defaults to selected_module.LLM
    # Recommended to use a separate fast LLM (e.g. free ChatGLMLLM) if not using selected_module.LLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions to load for function calling
    # handle_exit_intent and play_music are loaded by default; do not duplicate them
    # Example plugins below: weather, agent switching, news
    functions:
    - get_weather
    - get_news_from_newsnow
    - play_music
  function_call:
    # Do not change type
    type: function_call
    # Modules under plugins_func/functions to load for function calling
    # handle_exit_intent and play_music are loaded by default; do not duplicate them
    # Example plugins below: weather, agent switching, news
    functions:
    - change_role
    - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
    - get_news_from_newsnow
      # play_music is built-in; hass_play_music uses Home Assistant external media playback
      # Enable only one of play_music or hass_play_music
    - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1,000 free calls per month
    api_key: YOUR_CREDENTIAL
  nomem:
    # Use nomem to disable memory
    type: nomem
  mem_local_short:
    # Local memory summarized by selected_module.LLM; stored locally without external upload
    type: mem_local_short
    # Dedicated reasoning model for memory storage
    # If omitted, defaults to selected_module.LLM
    # Recommended to use a separate LLM (e.g. free ChatGLMLLM) if not using selected_module.LLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
  FunASRServer:
    # Standalone FunASR API deployment in 5 steps:
    # Step 1: mkdir -p ./funasr-runtime-resources/models
    # Step 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # Step 3 (inside container): cd FunASR/runtime
    # Step 4 (inside container): nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # Step 5 (inside container): tail -f log.txt
    # Once model download finishes in the logs, the service is ready to connect
    # Above is CPU inference; for GPU see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: YOUR_CREDENTIAL
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local ASR (requires manual model download)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese ASR model for low-resource devices (e.g. RK3566-2G; manual model download required)
    # Detailed guide: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Apply for keys and credentials here
    # https://console.volcengine.com/speech/app
    # DoubaoASR is billed per request; DoubaoStreamASR is billed per duration
    # Per-request is usually cheaper, while DoubaoStreamASR uses LLM tech for higher accuracy
    type: doubao
    appid: 你的火山引擎语音合成服务appid
    access_token: YOUR_CREDENTIAL
    cluster: volcengine_input_common
    # Hotword/replacement guide: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    output_dir: tmp/
  DoubaoStreamASR:
    # Apply for keys and credentials here
    # https://console.volcengine.com/speech/app
    # DoubaoASR is billed per request; DoubaoStreamASR is billed per duration
    # Activation URL: https://console.volcengine.com/speech/service/10011
    # Per-request is usually cheaper, while DoubaoStreamASR uses LLM tech for higher accuracy
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: YOUR_CREDENTIAL
    cluster: volcengine_input_common
    # Hotword/replacement guide: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Enable multilingual recognition mode
    enable_multilingual: false
    # When empty, supports Chinese/English/Shanghainese/Min Nan/Sichuan/Shaanxi/Cantonese; set a key for a specific language
    # Language list: https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Apply for token: https://console.cloud.tencent.com/cam/capi
    # Claim free quota: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音合成服务appid
    secret_id: YOUR_CREDENTIAL
    secret_key: YOUR_CREDENTIAL
    output_dir: tmp/
  AliyunASR:
    # Aliyun Intelligent Speech Interaction (enable service and get credentials on Aliyun)
    # HTTP POST request, processes complete audio in one call
    # Console: https://nls-portal.console.aliyun.com/
    # Appkey: https://nls-portal.console.aliyun.com/applist
    # Token: https://nls-portal.console.aliyun.com/overview
    # AliyunASR is for batch processing; AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is cheaper (0.004 CNY/s, 0.24 CNY/min)
    # AliyunStreamASR offers lower latency (0.005 CNY/s, 0.30 CNY/min)
    # Define ASR API type
    type: aliyun
    appkey: YOUR_CREDENTIAL
    token: YOUR_CREDENTIAL
    access_key_id: YOUR_CREDENTIAL
    access_key_secret: YOUR_CREDENTIAL
    output_dir: tmp/
  AliyunStreamASR:
    # Aliyun Intelligent Speech Interaction - real-time streaming ASR
    # WebSocket connection for real-time audio streaming
    # Console: https://nls-portal.console.aliyun.com/
    # Appkey: https://nls-portal.console.aliyun.com/applist
    # Token: https://nls-portal.console.aliyun.com/overview
    # AliyunASR is for batch processing; AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is cheaper (0.004 CNY/s, 0.24 CNY/min)
    # AliyunStreamASR offers lower latency (0.005 CNY/s, 0.30 CNY/min)
    # Define ASR API type
    type: aliyun_stream
    appkey: YOUR_CREDENTIAL
    token: YOUR_CREDENTIAL
    access_key_id: YOUR_CREDENTIAL
    access_key_secret: YOUR_CREDENTIAL
    # Server region (choose a closer endpoint to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # End-of-sentence silence threshold (ms), default 800ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Check quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: 你的百度语音技术AppID
    api_key: YOUR_CREDENTIAL
    secret_key: YOUR_CREDENTIAL
    # Language code (1537 = Mandarin); see: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition (requires OpenAI org and api_key)
    # Supports Chinese, English, Japanese, Korean, etc.; see https://platform.openai.com/docs/guides/speech-to-text
    # Requires internet access
    # Setup steps:
    # 1. Log in to OpenAI Platform: https://auth.openai.com/log-in
    # 2. Create API key: https://platform.openai.com/settings/organization/api-keys
    # 3. Choose gpt-4o-transcribe or gpt-4o-mini-transcribe
    type: openai
    api_key: YOUR_CREDENTIAL
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition (requires API key from Groq Console)
    # Setup steps:
    # 1. Log in to Groq Console: https://console.groq.com/home
    # 2. Create API key: https://console.groq.com/keys
    # 3. Choose whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en is English-only)
    type: openai
    api_key: YOUR_CREDENTIAL
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Website: https://alphacephei.com/vosk/
    # Configuration notes:
    # 1. VOSK is an offline speech recognition library supporting multiple languages
    # 2. Download models first: https://alphacephei.com/vosk/models
    # 3. Recommended Chinese models: vosk-model-small-cn-0.22 or vosk-model-cn-0.22
    # 4. Runs completely offline without internet access
    # 5. Output files are saved in tmp/
    # Usage steps:
    # 1. Download model from https://alphacephei.com/vosk/models
    # 2. Extract model files to models/vosk/ in the project directory
    # 3. Set the model path in config
    # 4. Note: VOSK Chinese output has no punctuation and spaces between words
    type: vosk
    model_path: 你的模型路径，如：models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition (requires Aliyun Bailian API key)
    # Setup steps:
    # 1. Log in to Aliyun Bailian Console: https://bailian.console.aliyun.com/
    # 2. Create API key: https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is based on Qwen multimodal and supports multilingual, singing, and noise rejection
    type: qwen3_asr_flash
    api_key: YOUR_CREDENTIAL
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options
    enable_lid: true  # Automatic language identification
    enable_itn: true  # Inverse text normalization
    #language: "zh"  # Language code (zh, en, ja, ko, etc.)
    context: ""  # Context string to improve accuracy (max 10,000 tokens)
  XunfeiStreamASR:
    # iFlytek streaming speech recognition
    # Create an app on iFlytek Open Platform to obtain credentials
    # iFlytek Open Platform: https://www.xfyun.cn/
    # Find credentials in 'My Apps' after creating the app:
    # - APPID
    # - APISecret  
    # - APIKey
    type: xunfei_stream
    # Required parameters - iFlytek Open Platform app info
    app_id: 你的APPID
    api_key: YOUR_CREDENTIAL
    api_secret: YOUR_CREDENTIAL
    # Recognition parameters
    domain: slm # Domain: iat (general), medical, finance, etc.
    language: zh_cn # Language: zh_cn (Chinese), en_us (English)
    accent: mandarin # Accent: mandarin
    # Tune audio processing parameters for better long-speech recognition
    output_dir: tmp/
  AliyunBLStreamASR:
    # Aliyun Bailian Paraformer real-time ASR
    # WebSocket streaming ASR with multilingual, custom hotwords, and semantic segmentation
    # Console: https://bailian.console.aliyun.com/
    # API Key: https://bailian.console.aliyun.com/#/api-key
    # Docs: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: YOUR_CREDENTIAL
    # Model selection (v2 recommended)
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 supports any sample rate; v1 only 16000; 8k versions only 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Filter filler words (e.g. 'um', 'ah')
    semantic_punctuation_enabled: false  # Semantic punctuation (true: meeting accuracy; false: VAD segmentation, low latency)
    max_sentence_silence: 200  # VAD silence threshold (ms), range 200-6000 (effective only in VAD mode)
    multi_threshold_mode_enabled: false  # Prevent overly long segments in VAD mode
    punctuation_prediction_enabled: true  # Auto punctuation prediction
    inverse_text_normalization_enabled: true  # Enable ITN (convert Chinese numerals to Arabic numerals)
    # Custom hotwords docs: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hotword ID (optional)
    # language_hints: ["zh", "en"]  # Language hints (optional): zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
