# If you only want a lightweight xiaozhi-server installation using local config files, ignore and do not modify this file.
# If you want to fetch configuration from manager-api, see below:
# Copy this file to xiaozhi-server/data/ (create the directory if missing) and rename it to .config.yaml
# Note: if data/.config.yaml already exists, delete it first
# Start manager-api and manager-web first, and register an account (the first registered account is admin)
# Log in as admin, go to Parameter Management, find server.secret and copy its value (note: server.secret changes on every fresh deployment)
# Open data/.config.yaml and set manager-api.secret to the copied server.secret
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP service port for the vision analysis API
  http_port: 8003
  # Vision analysis API URL
  # Vision analysis endpoint URL sent to devices
  # With the default setting below, the system auto-generates the vision URL and prints it in startup logs for browser verification
  # When deploying with Docker or on a public network (with SSL/domain), auto-generation may be inaccurate
  # For Docker deployments, set vision_explain to a LAN address
  # For public network deployments, set vision_explain to a public address
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
manager-api:
  # Your manager-api URL, preferably a LAN IP
  # For Docker deployments, set this to http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # Your manager-api token, i.e., the server.secret copied earlier
  secret: YOUR_CREDENTIAL
# Default system prompt template file
prompt_template: agent-base-prompt.txt
