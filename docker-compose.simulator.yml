name: iot_device_workbench
services:
  workbench:
    image: iot-platform-bridge:local
    build:
      context: ./platform-bridge
      dockerfile: runtime.Dockerfile
    working_dir: /app
    command: ["uvicorn", "tools.device_simulator.app:app", "--host", "0.0.0.0", "--port", "8011", "--no-access-log"]
    restart: unless-stopped
    read_only: true
    environment:
      DEVICE_WORKBENCH_CONFIG: /run/device-credentials.json
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - ./tools/device_simulator:/app/tools/device_simulator:ro
      - ${DEVICE_WORKBENCH_CONFIG:?Set DEVICE_WORKBENCH_CONFIG to the private device credential file}:/run/device-credentials.json:ro
